<!DOCTYPE html>
<html>
<head>
    <title>Book Front Cover</title>
    <style>
        body {
            background-color: rgb(148, 139, 139);
            font-family: Arial, sans-serif;
        }
        
        /* This single box is the front cover of the book */
        .book-cover {
            width: 380px;
            height: 550px;
            background-color: rgb(111, 10, 37);
            color: white;
            padding: 30px;
            margin: auto; /* Centers the book on screen */
            border: 5px solid gold;
            text-align: center; /* Centers all text and images */
        }

        h1 {
            color: gold;
            font-size: 32px;
            margin-top: 20px;
        }

        h3 {
            color: lightgray;
            font-weight: normal;
        }

        img {
            width: 180px;
            height: 180px;
            border: 3px solid gold;
            margin: 30px 0;
        }

        .author {
            color:gold;
            font-size: 18px;
            font-weight: bold;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="book-cover">
        <p>COMPLETE EDITION</p>
        <hr>

        <h1>WEB DESIGN<br>MADE EASY</h1>
        <h3>A Beginner's Guide to HTML & CSS</h3>

        <!-- Put any cover image named book.jpg in your static folder -->
        <img src="book.jpg" alt="Book Cover Image">

        <hr>
        <p class="author">By Ram Kumar</p>
        <p>ABC Publications</p>
    </div>

</body>
</html>
